<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1"
     width="512px" height="512px">
    <defs>
        <!-- Rich Blazor Brand Gradient for the Puzzle Piece Body -->
        <linearGradient id="blazorPuzzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#a855f7" />
            <stop offset="50%" stop-color="#7c3aed" />
            <stop offset="100%" stop-color="#4c1d95" />
        </linearGradient>

        <!-- Electric Cyan Glow for the Internal Cutout/Core -->
        <linearGradient id="electricCore" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="100%" stop-color="#0ea5e9" />
        </linearGradient>

        <!-- Professional Drop Shadow for Visual Separation -->
        <filter id="cleanShadow" x="-10%" y="-10%" width="125%" height="125%">
            <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
        </filter>
    </defs>

    <g filter="url(#cleanShadow)">
        <!-- 
      The Extension Puzzle Piece Structure 
      Carefully constructed vector with perfect interlocking tabs
    -->
        <path d="M 140 140 
             H 210 
             A 45 45 0 0 1 256 95 
             A 45 45 0 0 1 302 140 
             H 372 
             V 210 
             A 45 45 0 0 1 327 256 
             A 45 45 0 0 1 372 302 
             V 372 
             H 302 
             A 45 45 0 0 0 256 417 
             A 45 45 0 0 0 210 372
             H 140 
             V 302
             A 45 45 0 0 1 185 256
             A 45 45 0 0 1 140 210
             Z"
              fill="url(#blazorPuzzleGrad)"
              stroke="#ffffff"
              stroke-width="6"
              stroke-linejoin="round" />
    </g>

    <!-- 
    The Blazor Lightning Core Cutout
    Placed exactly in the center of the extension piece to show integration
  -->
    <g filter="url(#cleanShadow)">
        <path d="M 275 160 
             L 195 275 
             L 245 275 
             L 215 360 
             L 305 245 
             L 255 245 
             Z"
              fill="url(#electricCore)"
              stroke="#ffffff"
              stroke-width="3"
              stroke-linejoin="round" />
    </g>
</svg>
